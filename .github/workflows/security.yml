name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: new advisories appear even when nobody pushed code.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails when a dependency that ships to production has a known advisory (moderate or worse).
      - name: Known-vulnerable dependencies
        run: pnpm audit --prod --audit-level=moderate
