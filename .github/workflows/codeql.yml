name: CodeQL

# Static analysis for common code vulnerabilities (injection, XSS, unsafe redirects...).
# Free for public repositories; a private repository needs GitHub code security enabled, otherwise this job fails (CI is not affected).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 5 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
