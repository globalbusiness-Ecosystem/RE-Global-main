  axios: '>=1.20.0'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.16'
  browserslist: '>=4.28.7'
  source-map-js: '>=1.2.2'
  '@fastify/busboy': '>=3.2.2'
  protobufjs: '>=7.6.5'
  smol-toml: '>=1.9.0'
  dompurify: '>=3.4.17'
  node-forge: '>=1.4.3'
  follow-redirects: '>=1.16.3'
  fast-xml-parser: '>=5.12.0'
  uuid: '>=11.1.1'
  sharp: '>=0.35.5'
