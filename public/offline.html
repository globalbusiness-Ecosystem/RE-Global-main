<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RE Platform — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0f;color:#f4f4f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
    main{max-width:420px}
    h1{font-size:1.4rem;margin:0 0 .5rem}
    p{color:#a1a1aa;line-height:1.6;margin:.25rem 0}
    button{margin-top:1.25rem;padding:.7rem 1.4rem;border:0;border-radius:10px;background:#f59e0b;color:#111;font-weight:600;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1 id="t">You're offline · لا يوجد اتصال</h1>
    <p id="m">Check your internet connection and try again.</p>
    <p id="m2" dir="rtl">تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
    <button id="b" onclick="location.reload()">Retry · إعادة المحاولة</button>
  </main>
  <script>
  // Shows the page in the language chosen in the app (same key the app uses), else the browser's language.
  // Without JavaScript the English + Arabic text above stays as it is.
  (function () {
    var T = {
      en: { t: "You're offline", m: 'Check your internet connection and try again.', b: 'Retry' },
      ar: { t: 'لا يوجد اتصال', m: 'تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.', b: 'إعادة المحاولة' },
      fr: { t: 'Vous êtes hors ligne', m: 'Vérifiez votre connexion Internet et réessayez.', b: 'Réessayer' },
      es: { t: 'Sin conexión', m: 'Comprueba tu conexión a internet e inténtalo de nuevo.', b: 'Reintentar' },
      pt: { t: 'Você está offline', m: 'Verifique sua conexão com a internet e tente novamente.', b: 'Tentar novamente' },
      ur: { t: 'آپ آف لائن ہیں', m: 'اپنا انٹرنیٹ کنکشن چیک کریں اور دوبارہ کوشش کریں۔', b: 'دوبارہ کوشش کریں' },
      zh: { t: '您已离线', m: '请检查网络连接后重试。', b: '重试' }
    };
    var has = function (k) { return Object.prototype.hasOwnProperty.call(T, k); };
    var lang = '';
    try { lang = localStorage.getItem('re_nav_language') || ''; } catch (e) {}
    if (!has(lang)) lang = String(navigator.language || 'en').slice(0, 2).toLowerCase();
    if (!has(lang)) return;
    var s = T[lang];
    var el = function (id) { return document.getElementById(id); };
    el('t').textContent = s.t;
    el('m').textContent = s.m;
    el('m2').style.display = 'none';
    el('b').textContent = s.b;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' || lang === 'ur' ? 'rtl' : 'ltr';
    document.title = 'RE Platform — ' + s.t;
  })();
  </script>
</body>
</html>
